name: Record platform digest
description: Hand off immutable, source-bound platform digests as artifacts
inputs:
  digest:
    description: Registry manifest digest
    required: true
  platform:
    description: linux/amd64 or linux/arm64
    required: true
  version:
    description: Build version
    required: true
  source-sha:
    description: Source commit
    required: true
runs:
  using: composite
  steps:
    - id: record
      shell: bash
      env:
        IMAGE_HELPER: ${{ github.action_path }}/../../../scripts/images.mjs
        IMAGE_DIGEST: ${{ inputs.digest }}
        IMAGE_PLATFORM: ${{ inputs.platform }}
        IMAGE_VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: node "$IMAGE_HELPER" record
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.record.outputs.name }}
        path: ${{ steps.record.outputs.file }}
        if-no-files-found: error
        overwrite: true
        retention-days: 3
