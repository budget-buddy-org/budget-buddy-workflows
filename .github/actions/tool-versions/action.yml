name: Shared tool versions
description: Read the centrally maintained runtime and image-tool versions
outputs:
  node:
    description: Node version
    value: ${{ steps.versions.outputs.node }}
  pnpm:
    description: pnpm version
    value: ${{ steps.versions.outputs.pnpm }}
  trivy:
    description: Trivy version
    value: ${{ steps.versions.outputs.trivy }}
  cosign:
    description: Cosign version
    value: ${{ steps.versions.outputs.cosign }}
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      env:
        VERSIONS_FILE: ${{ github.action_path }}/../../../runtime-versions.json
      run: |
        node --input-type=commonjs - <<'JS'
        const fs = require('node:fs');
        const versions = JSON.parse(fs.readFileSync(process.env.VERSIONS_FILE));
        for (const [name, value] of Object.entries(versions)) {
          if (!/^\d+\.\d+\.\d+$/.test(value)) throw new Error('Invalid ' + name + ' version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
        }
        JS
