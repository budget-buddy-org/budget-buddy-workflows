name: Scan sign and publish image
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    outputs:
      digest:
        description: Signed multi-platform manifest digest
        value: ${{ jobs.publish.outputs.digest }}
permissions:
  contents: read
concurrency:
  group: image-publication-${{ github.repository }}-${{ inputs.version }}-${{ inputs.publish }}
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: image-linux-amd64
          - platform: linux/arm64
            artifact: image-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
      - uses: $/.github/actions/setup-container
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/records
      - uses: $/.github/actions/verify-image-records
        id: record
        with:
          directory: ${{ runner.temp }}/records
          version: ${{ inputs.version }}
          source-sha: ${{ inputs.source-sha }}
          platform: ${{ matrix.platform }}
      - uses: $/.github/actions/scan-image
        with:
          image-ref: ${{ steps.record.outputs.image }}@${{ steps.record.outputs.digest }}
          platform: ${{ matrix.platform }}
  publish:
    needs: scan
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: $/.github/actions/setup-container
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - uses: $/.github/actions/publish-image
        id: publish
        with:
          directory: ${{ runner.temp }}/records
          version: ${{ inputs.version }}
          source-sha: ${{ inputs.source-sha }}
          publish: ${{ inputs.publish }}
