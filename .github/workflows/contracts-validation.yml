name: Contracts validation
on:
  workflow_call:
permissions:
  contents: read
  packages: read
concurrency:
  group: contracts-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-java
      - uses: $/.github/actions/setup-node
      - name: Lint spec
        run: pnpm run lint
      - name: Validate spec
        run: pnpm run validate
      - name: Generate TypeScript
        run: pnpm run generate:ts
      - name: Typecheck generated TypeScript
        run: pnpm exec tsc --noEmit --emitDeclarationOnly false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify Java contracts publication
        run: sh scripts/verify-java-publication.sh
