name: Web CI
on:
  workflow_call:
permissions:
  contents: read
  packages: read
concurrency:
  group: web-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/setup-node
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
