name: Commitlint
on:
  workflow_call:
permissions:
  contents: read
  packages: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: $/.github/actions/setup-node
        with:
          ignore-scripts: 'true'
      - uses: $/.github/actions/commitlint
